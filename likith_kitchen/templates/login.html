{% extends "base.html" %}
{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <div class="card" style="width: 100%; max-width: 450px; padding: 40px;">
    <div class="text-center mb-4">
      <h2><i class="fa-solid fa-right-to-bracket text-accent"></i> Welcome Back</h2>
      <p class="text-muted">Sign in to your Likith's Kitchen account</p>
    </div>

    <form method="post">
      {% csrf_token %}
      
      {% for field in form %}
      <div class="mb-4">
        <label style="display:block; margin-bottom: 5px; color: var(--text-muted);">{{ field.label }}</label>
        {{ field }}
        {% if field.errors %}
          <div style="color: var(--danger); font-size: 0.85rem; margin-top: 5px;">{{ field.errors.0 }}</div>
        {% endif %}
      </div>
      {% endfor %}

      <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
        Login
      </button>
    </form>
    
    <div class="text-center mt-4">
      <p class="text-muted">Don't have an account? <a href="/register/" class="text-accent" style="font-weight: 600;">Sign up here</a></p>
    </div>
  </div>
</div>

<script>
  // Add our custom class to Django's form fields
  document.querySelectorAll('input').forEach(input => {
    if (input.type !== 'hidden' && input.type !== 'submit') {
      input.classList.add('form-control');
    }
  });
</script>
{% endblock %}
